# Discovery and healthcheck are public; versioned resource routes use Keystone.
[pipeline:coast]
pipeline = http_proxy_to_wsgi request_id cors microversions errors routes

[pipeline:coast-noauth]
pipeline = http_proxy_to_wsgi request_id cors microversions errors routes-noauth

[composite:routes]
use = egg:Paste#urlmap
/healthcheck = healthcheck
/v1 = coastv1_pipeline
/ = api

[composite:routes-noauth]
use = egg:Paste#urlmap
/healthcheck = healthcheck
/v1 = apiv1
/ = api

[pipeline:coastv1_pipeline]
pipeline = authtoken apiv1

[app:api]
paste.app_factory = coast.api.app:factory

[app:apiv1]
paste.app_factory = coast.api.app:factory
versioned = true

[app:healthcheck]
paste.app_factory = coast.api.app:healthcheck_factory

[filter:authtoken]
paste.filter_factory = coast.api.app:auth_factory

[filter:errors]
paste.filter_factory = coast.api.errors:factory

[filter:microversions]
paste.filter_factory = coast.api.microversions:factory

[filter:request_id]
paste.filter_factory = oslo_middleware:RequestId.factory

[filter:cors]
paste.filter_factory = coast.api.app:cors_factory

[filter:http_proxy_to_wsgi]
paste.filter_factory = oslo_middleware.http_proxy_to_wsgi:HTTPProxyToWSGI.factory
