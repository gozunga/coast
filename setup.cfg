[metadata]
name = gozunga-coast
summary = OpenStack service that runs per-project app hosting stacks on Nova, Neutron and Cinder
description_file = README.md
description_content_type = text/markdown
author = Coast contributors
home_page = https://github.com/gozunga/coast
license = Apache-2.0
python_requires = >=3.10
classifier =
    Environment :: OpenStack
    Intended Audience :: Information Technology
    Intended Audience :: System Administrators
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX :: Linux
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[files]
packages =
    coast
data_files =
    etc/coast =
        etc/coast/api-paste.ini

[entry_points]
console_scripts =
    coast-agent = coast.cmd.agent:main
    coast-manage = coast.cmd.manage:main
    coast-api = coast.cmd.api:main
    coast-conductor = coast.cmd.conductor:main
    coast-health-manager = coast.cmd.health_manager:main
    coast-db-manage = coast.cmd.db_manage:main
    coast-status = coast.cmd.status:main
    coast-console-proxy = coast.cmd.console_proxy:main

wsgi_scripts =
    coast-wsgi-api = coast.api.wsgi:init_application

coast.drivers =
    coolify_v4 = coast.drivers.coolify.v4:CoolifyV4Driver
    noop = coast.drivers.noop:NoopDriver

oslo.config.opts =
    coast = coast.common.opts:list_opts
    coast.messaging = coast.common.opts:list_messaging_opts

oslo.config.opts.defaults =
    coast = coast.common.opts:set_defaults

oslo.policy.policies =
    coast = coast.policies:list_rules

oslo.policy.enforcer =
    coast = coast.common.policy:get_enforcer
