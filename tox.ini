[tox]
minversion = 4.0.0
envlist = py3,pep8,docs
skip_missing_interpreters = true

[testenv]
usedevelop = true
setenv =
  PYTHONWARNINGS=default::DeprecationWarning
  OS_STDOUT_CAPTURE=1
  OS_STDERR_CAPTURE=1
  OS_TEST_TIMEOUT=60
deps =
  -c{env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/2026.1}
  -r{toxinidir}/requirements.txt
  -r{toxinidir}/test-requirements.txt
commands =
  stestr --test-path=./coast/tests/unit run {posargs}
  stestr slowest

[testenv:functional]
passenv = OS_TEST_DBAPI_ADMIN_CONNECTION
# Functional tests: real DB (sqlite/MySQL), fake RPC, drivers against
# requests-mock or a pinned Coolify (see doc/source/driver-interface.md).
commands =
  stestr --test-path=./coast/tests/functional run {posargs}

[testenv:doc-examples]
commands = python tools/check_doc_examples.py {posargs}

[testenv:contract-coolify]
# Live, destructive tests on an isolated development engine only.
passenv =
  COAST_CONTRACT_COOLIFY_*
setenv =
  {[testenv]setenv}
  OS_TEST_TIMEOUT=3600
commands =
  stestr --test-path=./coast/tests/contract/coolify run --concurrency=1 {posargs}

[testenv:pep8]
commands =
  flake8 {posargs}
  bandit -r coast -x coast/tests -n5 -ll
  doc8 doc/source README.md --ignore-path doc/source/images

[testenv:cover]
setenv =
  {[testenv]setenv}
  PYTHON=coverage run --source coast --parallel-mode
commands =
  stestr --test-path=./coast/tests/unit run {posargs}
  coverage combine
  coverage html -d cover
  coverage xml -o cover/coverage.xml
  coverage report --fail-under=80

[testenv:docs]
# Build the complete publication and validate its API fragment links.
deps =
  -c{env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/2026.1}
  -r{toxinidir}/doc/requirements.txt
commands =
  sphinx-build -W -b html -d api-ref/build/doctrees api-ref/source doc/build/html/api-ref
  sphinx-build -W -b html doc/source doc/build/html
  python -m unittest discover -s tools/tests -p test_doc_publication.py
  python tools/check_doc_publication.py doc/build/html

[testenv:api-ref]
# Build the os-api-ref tree. os-api-ref is already in doc/requirements.txt.
# https://docs.openstack.org/os-api-ref/latest/usage.html
deps =
  -c{env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/2026.1}
  -r{toxinidir}/doc/requirements.txt
commands =
  sphinx-build -W -b html -d api-ref/build/doctrees api-ref/source api-ref/build/html

[testenv:releasenotes]
deps =
  -c{env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/2026.1}
  -r{toxinidir}/doc/requirements.txt
commands = reno lint

[testenv:genconfig]
commands =
  oslo-config-generator --config-file=etc/coast/coast-config-generator.conf

[testenv:genpolicy]
commands =
  oslopolicy-sample-generator --config-file=etc/coast/coast-policy-generator.conf

[testenv:template-catalog]
# Download only build-time metadata from the digest-locked pinned tag.
deps =
commands =
  python tools/gen-template-catalog.py --check-pinned

[testenv:kolla-role]
# Kolla role syntax and config-only render harness (tools/kolla/README.rst).
# Pinned to a kolla-ansible 2026.1 commit.
skip_install = true
deps =
  ansible-core==2.20.10
  kolla-ansible @ git+https://opendev.org/openstack/kolla-ansible@7101c4cc7fe83937686a39dbe0174293423e32a2
allowlist_externals = bash
setenv =
  ANSIBLE_LOCAL_TEMP={envtmpdir}/ansible-local
  ANSIBLE_REMOTE_TEMP={envtmpdir}/ansible-remote
  ANSIBLE_ROLES_PATH={toxinidir}/tools/kolla/ansible/roles:{envdir}/share/kolla-ansible/ansible/roles
  ANSIBLE_LIBRARY={envdir}/share/kolla-ansible/ansible/library
  ANSIBLE_FILTER_PLUGINS={envdir}/share/kolla-ansible/ansible/filter_plugins
  ANSIBLE_ACTION_PLUGINS={envdir}/share/kolla-ansible/ansible/action_plugins
  ANSIBLE_MODULE_UTILS={envdir}/share/kolla-ansible/ansible/module_utils
  # CI runs as root without sudo; the role's become then needs no tool.
  ANSIBLE_BECOME_METHOD={env:ANSIBLE_BECOME_METHOD:sudo}
  ANSIBLE_COLLECTIONS_PATH={envtmpdir}/collections
# loadbalancer-config (haproxy-config) uses ansible.posix.firewalld.
commands_pre =
  ansible-galaxy collection install -p {envtmpdir}/collections ansible.posix:==2.1.0
commands =
  ansible-playbook --syntax-check -i localhost, tools/kolla/tests/syntax.yml
  ansible-playbook --syntax-check -i localhost, tools/kolla/ansible/certificates.yml
  ansible-playbook -i localhost, tools/kolla/tests/render.yml
  bash tools/kolla/tests/cli-certificates.sh {envtmpdir}
  bash tools/kolla/tests/playbook-syntax.sh {envdir}/share/kolla-ansible/ansible {envtmpdir}

[testenv:kolla-images]
# Render the kolla-build overlay for Coast images (Q141); no Docker needed.
skip_install = true
deps =
  kolla==22.2.0
  docker
allowlist_externals = bash
commands =
  bash tools/kolla/tests/kolla-images-render.sh {envtmpdir}

[testenv:venv]
commands = {posargs}

[flake8]
# H106: Don't put vim configuration in source files
# H203: Use assertIs(Not)None to check for None
# H204/H205: Use assert(Not)Equal / assert{Greater,Less}(Equal)
enable-extensions = H106,H203,H204,H205
show-source = true
builtins = _
exclude = .venv,.git,.tox,dist,doc,*egg,build,releasenotes
import-order-style = pep8
application-import-names = coast
max-complexity = 20

[hacking]
import_exceptions = coast.i18n

