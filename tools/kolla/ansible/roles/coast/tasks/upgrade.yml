---
- name: Check upgrade inputs and ports
  ansible.builtin.import_tasks: precheck.yml

- name: Render configuration
  ansible.builtin.import_tasks: config.yml

- name: Register Coast resources
  ansible.builtin.import_tasks: register.yml

- name: Manage the host management interface
  ansible.builtin.include_tasks: hm-interface.yml
  when:
    - coast_hm0_manage | bool
    - inventory_hostname in groups['coast-conductor'] or (coast_enable_health_manager | bool and inventory_hostname in groups['coast-health-manager'])

- name: Apply database migrations before restarting services
  ansible.builtin.import_tasks: bootstrap.yml

- name: Restart all enabled Coast services
  ansible.builtin.debug:
    msg: Apply the upgraded service image and configuration.
  changed_when: true
  notify:
    - Restart coast-api container
    - Restart coast-conductor container
    - Restart coast-health-manager container
    - Restart coast-console-proxy container

- name: Apply pending container changes
  ansible.builtin.meta: flush_handlers
