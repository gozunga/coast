---
features:
  - |
    Coast can store a dedicated Keystone user for agent-facing
    control-plane checks. The user is ``coast-agent`` in the service
    project. Its only role is ``coast_agent``. That role is not
    ``admin`` and not ``service``. Coast policy does not grant the
    role on any API rule. ``[agent_auth]`` holds the password on the
    control plane. The guest config drive does not receive it. Cloud
    clients stay on the ``coast`` service user. When ``[agent_auth]``
    is set, conductor, health-manager and console-proxy startup
    reject a user name that matches the service user. Kolla reads
    ``coast_agent_keystone_password`` from ``passwords.yml``. The
    DevStack plugin creates the same user. See the operations guide
    for password rotation.
