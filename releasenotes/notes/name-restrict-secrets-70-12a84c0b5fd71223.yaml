security:
  - |
    Coast names and attributes every Barbican secret to its owner,
    disables project-wide read access, and grants read to the Coast service
    user only. Project admins and Barbican admins retain access according to
    Barbican policy. Failed ACL or metadata setup rolls back the secret.
features:
  - |
    The read-only janitor report detects unreferenced or ownerless named
    Coast secrets and reports database references to missing Barbican secrets.
